<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POF Verification H5 Demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="topbar">
        <span>POF VERIFICATION</span>
        <span id="statusBadge" class="idle">未检测</span>
      </div>

      <h1>人脸验证</h1>

      <p class="desc">
        请上传 POI 照片和 10MB 以内 MP4 视频，系统将进行质量检测、活体检测与人脸比对。
      </p>

      <div class="form-group">
        <label for="apiUrl">API 地址</label>
        <input id="apiUrl" type="text" value="http://localhost:8000" />
      </div>

      <div class="form-group">
        <label for="userId">用户 ID</label>
        <input id="userId" type="text" value="user_12345" />
      </div>

      <div class="form-group">
        <label for="brand" class="section-label">
          品牌配置
        </label>

        <select id="brand" class="modern-select">
          <option value="default">Default</option>
          <option value="vantage">Vantage</option>
          <option value="brand_a">Brand A</option>
        </select>
      </div>

      <div class="form-group">
        <label for="scenario" class="section-label demo-label">
          Demo 演示场景验证
        </label>

       <div class="form-group">
        <label class="section-label">
          验证模式
        </label>

        <div class="mode-group">

          <label class="mode-card">
            <input type="radio" name="verifyMode" value="auto" checked/>

            <div class="mode-content">
              <div class="mode-title">
                真实 AI 验证
              </div>

              <div class="mode-desc">
                使用 OCR + InsightFace 实际检测证件与视频人脸。
              </div>
            </div>
          </label>

          <label class="mode-card">
            <input type="radio" name="verifyMode" value="demo"/>

            <div class="mode-content">
              <div class="mode-title">
                Demo 场景验证
              </div>

              <div class="mode-desc">
                使用 Mock 数据模拟审核结果。
              </div>
            </div>
          </label>

        </div>

      </div>

        <div class="form-group" id="demoScenarioWrapper" style="display:none;" >
          <label class="section-label">
            Demo 演示场景
          </label>

          <select id="scenario" class="modern-select">

            <option value="approved">验证通过</option>
            <option value="manual_review">人工审核</option>
            <option value="quality_failed">视频质量不合格</option>
            <option value="liveness_failed">活体检测失败</option>
            <option value="face_mismatch">人脸不匹配</option>
            <option value="attribute_mismatch">性别/年龄不匹配</option>
          </select>

          <p class="demo-tip">
            用于演示不同审核结果，不影响真实 AI 人脸比对。
          </p>
        </div>

      </div>

      <div class="form-group">
        <label for="poiImageFile">POI 照片</label>
        <label class="upload-box" for="poiImageFile">
          <strong>选择或拍摄 POI 照片</strong>
          <span id="poiImageName">未选择照片</span>
        </label>
        <input
          id="poiImageFile"
          class="hidden"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        />
      </div>

      <div class="form-group">
        <label for="videoFile">POF 视频</label>
        <label class="upload-box" for="videoFile">
          <strong>选择或拍摄 MP4 视频</strong>
          <span id="fileName">未选择视频</span>
        </label>
        <input
          id="videoFile"
          class="hidden"
          type="file"
          accept="video/mp4,video/quicktime,.mov"
        />
      </div>

      <div class="actions">
        <button id="healthBtn" type="button" class="secondary">
          健康检查
        </button>

        <button id="verifyBtn" type="button" class="primary">
          提交验证
        </button>
      </div>

      <section id="result" class="result hidden"></section>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
